version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: vedaai-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vedaai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: vedaai-redis
    ports:
      - "6379:6379"

volumes:
  pg_data:
